name: Aegis DevSecOps Pipeline

on:
  push:
    branches: [ "main", "dev" ]
  pull_request:
    branches: [ "main" ]

jobs:
  backend-sast-lint:
    name: Backend Linter & SAST (Python)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ruff bandit
          if [ -f backend/requirements.txt ]; then pip install -r backend/requirements.txt; fi

      - name: Lint with Ruff
        run: |
          # Analizador ultra-rápido de código estático para Python
          ruff check backend/src

      - name: Security Audit with Bandit (SAST)
        run: |
          # Escaneo de vulnerabilidades de seguridad estática en el código Backend
          # (B104 skip: permite bind a 0.0.0.0 para entornos Dockerizados)
          bandit -r backend/src --skip B104 -ll -ii

  frontend-build:
    name: Frontend Build & Type Check (Node.js)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: ./frontend
        run: npm ci

      - name: Build and Type Check
        working-directory: ./frontend
        run: npm run build
