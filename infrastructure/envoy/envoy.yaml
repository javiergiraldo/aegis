admin:
  address:
    socket_address:
      address: 0.0.0.0
      port_value: 9901

static_resources:
  listeners:
  - name: listener_http
    address:
      socket_address:
        address: 0.0.0.0
        port_value: 80
    filter_chains:
    - filters:
      - name: envoy.filters.network.http_connection_manager
        typed_config:
          "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
          stat_prefix: ingress_http
          codec_type: AUTO
          route_config:
            name: local_route
            virtual_hosts:
            - name: backend_service
              domains: ["*"]
              # Hardening: Configuración estricta de CORS
              cors:
                allow_origin_string_match:
                - safe_regex:
                    google_re2: {}
                    regex: ".*"
                allow_methods: "GET, POST, PUT, DELETE, OPTIONS"
                allow_headers: "Origin, X-Requested-With, Content-Type, Accept, Authorization"
                max_age: "86400"
              # Hardening: Inyección de cabeceras de seguridad HTTP
              response_headers_to_add:
              - header:
                  key: "Strict-Transport-Security"
                  value: "max-age=63072000; includeSubDomains; preload"
              - header:
                  key: "X-Frame-Options"
                  value: "DENY"
              - header:
                  key: "X-Content-Type-Options"
                  value: "nosniff"
              - header:
                  key: "X-XSS-Protection"
                  value: "1; mode=block"
              routes:
              - match:
                  prefix: "/socket.io"
                route:
                  cluster: aegis_backend_cluster
                  upgrade_configs:
                  - upgrade_type: websocket
              - match:
                  prefix: "/api"
                route:
                  cluster: aegis_backend_cluster
          http_filters:
          - name: envoy.filters.http.cors
            typed_config:
              "@type": type.googleapis.com/envoy.extensions.filters.http.cors.v3.Cors
          # Hardening: Rate Limiting para mitigar DDoS / Fuerza Bruta
          - name: envoy.filters.http.local_ratelimit
            typed_config:
              "@type": type.googleapis.com/envoy.extensions.filters.http.local_ratelimit.v3.LocalRateLimit
              stat_prefix: http_local_rate_limiter
              token_bucket:
                max_tokens: 200        # Máximo de ráfaga
                tokens_per_fill: 20    # Tasa de recarga
                fill_interval: 1s      # Cada segundo
              filter_enabled:
                runtime_key: local_rate_limit_enabled
                default_value:
                  numerator: 100
                  denominator: HUNDRED
              filter_enforced:
                runtime_key: local_rate_limit_enforced
                default_value:
                  numerator: 100
                  denominator: HUNDRED
              response_headers_to_add:
                - append_action: OVERWRITE_IF_EXISTS_OR_ADD
                  header:
                    key: x-rate-limited
                    value: "true"
          - name: envoy.filters.http.router
            typed_config:
              "@type": type.googleapis.com/envoy.extensions.filters.http.router.v3.Router

  clusters:
  - name: aegis_backend_cluster
    connect_timeout: 0.25s
    type: STRICT_DNS
    lb_policy: ROUND_ROBIN
    load_assignment:
      cluster_name: aegis_backend_cluster
      endpoints:
      - lb_endpoints:
        - endpoint:
            address:
              socket_address:
                address: backend
                port_value: 8000
